    /* ===== GRILLE D'AUTEURS ===== */
    .grille-auteurs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.6rem;
      margin-top: 2rem;
    }

    /* ===== CARTE AUTEUR ===== */
    .carte {
      background: #ffffff;
      border-radius: 20px;
      padding: 2.2rem 1.5rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
      border: 1px solid #e8e2d9;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .carte:hover {
      border-color: #b07d5e;
      box-shadow: 0 12px 28px -8px rgba(176, 125, 94, 0.25);
      transform: translateY(-4px);
    }

    /* ===== NOM DE L'AUTEUR (SEUL LIEN) ===== */
    .carte .auteur {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #1e2b2f;
      text-decoration: none;
      display: inline-block;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }

    .carte .auteur:hover {
      color: #8b5e3c;
      border-bottom-color: #b07d5e;
    }

    /* ===== PIED DE PAGE ===== */
    .pied {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e6e3dd;
      text-align: center;
      font-size: 0.9rem;
      color: #8a8a8a;
      font-style: italic;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      body {
        padding: 1rem 0.8rem;
      }

      .page {
        padding: 1.8rem 1.2rem;
        border-radius: 18px;
      }

      h1 {
        font-size: 1.9rem;
        padding-left: 1rem;
      }

      .sous-titre {
        padding-left: 1rem;
        font-size: 0.95rem;
      }

      .grille-auteurs {
        grid-template-columns: 1fr;
        gap: 1.2rem;
      }

      .carte {
        padding: 1.6rem 1.2rem;
      }

      .carte .auteur {
        font-size: 1.25rem;
      }
    }
